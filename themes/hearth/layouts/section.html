{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
</header>
{{ with .Pages }}
  <ul class="post-list">
    {{ range . }}
      <li>
        {{ partial "post-meta.html" . }}
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        {{ with .Description }}<p>{{ . }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ else }}
  <p class="empty-state">No entries published yet. Stay tuned!</p>
{{ end }}
{{ end }}

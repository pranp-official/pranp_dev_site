{{ define "main" }}
<header class="page-header">
  <h1>Tag: {{ .Title }}</h1>
  {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
</header>
<ul class="post-list">
  {{ range .Pages }}
    <li>
      {{ partial "post-meta.html" . }}
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      {{ with .Description }}<p>{{ . }}</p>{{ end }}
    </li>
  {{ end }}
</ul>
{{ end }}

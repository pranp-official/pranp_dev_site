{{ $parts := slice }}
{{ range slice "js/theme.js" "js/copy.js" "js/search.js" }}
  {{ with resources.Get . }}{{ $parts = $parts | append . }}{{ end }}
{{ end }}
{{ $js := $parts | resources.Concat "js/hearth.js" | resources.Minify | resources.Fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
{{ if .Store.Get "hasMermaid" }}
<script src="{{ "js/mermaid.min.js" | relURL }}"></script>
<script>
  (function () {
    var forced = document.documentElement.getAttribute("data-theme");
    var dark = forced ? forced === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    mermaid.initialize({
      startOnLoad: true,
      theme: "base",
      themeVariables: {
        fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif",
        fontSize: "13.5px",
        primaryColor: dark ? "#26201C" : "#FCFAF7",
        primaryBorderColor: "#A3472B",
        primaryTextColor: dark ? "#F5F0EB" : "#1C1815",
        lineColor: dark ? "#D97757" : "#A3472B",
        secondaryColor: dark ? "#211C19" : "#F3EDE4",
        secondaryBorderColor: dark ? "#4A3E37" : "#D4C5B9",
        tertiaryColor: dark ? "#1C1815" : "#FFFFFF",
        tertiaryBorderColor: dark ? "#3E3630" : "#E2D7CC",
        clusterBkg: dark ? "#201B18" : "#F5EFE6",
        clusterBorder: dark ? "#423730" : "#D8CABE",
        edgeLabelBackground: dark ? "#26201C" : "#FCFAF7",
        nodeBorder: "#A3472B",
        mainBkg: dark ? "#26201C" : "#FCFAF7"
      }
    });
  })();
</script>
{{ end }}

<header class="site-header">
  <a class="site-title site-terminal" href="{{ "/" | relLangURL }}" aria-label="{{ site.Title }} - Home">
    <span class="terminal-tilde">~</span>pranp
  </a>
  <nav aria-label="Primary">
    <ul>
      {{ range site.Menus.main }}
      <li>
        <a href="{{ .URL }}" {{ if or ($.IsMenuCurrent "main" .) ($.HasMenuCurrent "main" .) }}aria-current="page"{{ end }}>{{ .Name }}</a>
      </li>
      {{ end }}
      <li>
        <a href="{{ "search/" | relLangURL }}" aria-label="Search">Search</a>
      </li>
    </ul>
  </nav>
  {{ partial "theme-toggle.html" . }}
</header>

{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Content }}<div class="lede">{{ . }}</div>{{ end }}
</header>
<div class="card-grid">
  {{ range .Pages }}
    <article class="card">
      <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
      <p>{{ .Description }}</p>
      {{ with .Params.links }}
        <p class="links">
          {{ range . }}
            <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">{{ .label }}</a>{{ " " }}
          {{ end }}
        </p>
      {{ end }}
    </article>
  {{ end }}
</div>
{{ end }}

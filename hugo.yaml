baseURL: "https://www.pranp.dev/"
locale: en-us
title: "Pranav"
theme: hearth


pagination:
  pagerSize: 10

enableRobotsTXT: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  description: "Notes on cloud security and identity"
  author:
    name: "Pranav"
    title: "Security Engineer"
    bio: "Security engineer focusing on cloud infrastructure security, identity systems, and zero-trust architectures."
    image: "/images/author.svg"
    url: "/"
    github: "https://github.com/pranp-official"
    linkedin: "https://www.linkedin.com/in/pranp"

menus:
  main:
    - name: About
      pageRef: /about
      weight: 10
    - name: Blog
      pageRef: /blog
      weight: 20
    - name: Work
      pageRef: /projects
      weight: 30
    - name: Notes
      pageRef: /notes
      weight: 40

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
  highlight:
    noClasses: false
    guessSyntax: false

